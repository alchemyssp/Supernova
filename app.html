<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supernova Off-take</title>
<link rel="icon" href="img/supernovas-64.png">
<link rel="apple-touch-icon" href="img/supernovas-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=5">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="js/config.js?v=1"></script>
<script src="js/common.js?v=5"></script>
<script src="js/parsers.js?v=2"></script>
<script src="js/match.js?v=3"></script>
<script src="js/datau.js?v=1"></script>
<script src="js/form-fill.js?v=3"></script>
<script src="js/sheet-export.js?v=1"></script>
<script src="templates/form_skus.js?v=1"></script>
<style>
  .step { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .step b.num { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: var(--white); color: var(--ink); display: grid; place-items: center; font-weight: 500; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .step h2 { margin: 0; }
  .line { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .line .muted { flex: 1 1 260px; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .result { margin: 14px 0 0; font-size: 15px; }
  td.pick { min-width: 320px; }
  .sug { display: inline-block; margin: 5px 6px 0 0; padding: 3px 11px; border-radius: 99px; background: var(--glass-2); font-size: 12px; cursor: pointer; border: 0; color: var(--text); }
  .sug:hover { background: var(--white); color: var(--ink); }
  tr.skip td { color: var(--faint); }
  .peek td { font-size: 12px; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  .peek tr.head td { background: var(--glass-3); font-weight: 500; }
  .colmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  details summary { cursor: pointer; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body class="single">
<header class="top">
  <img src="img/supernovas-wordmark.png" alt="Supernova's">
  <button class="link" id="signout" type="button">Sign out</button>
</header>
<main>

  <!-- 1. Data U -->
  <div class="card">
    <div class="step"><b class="num">1</b><h2>Data U</h2></div>
    <div class="line">
      <span class="muted" id="duInfo">Loading…</span>
      <label class="btn light file-btn">Upload Data U<input type="file" id="duFile" accept=".xlsx,.xlsm"></label>
    </div>
    <p id="duMsg" class="muted" style="margin:10px 0 0" hidden></p>
  </div>

  <!-- 2. WS report -->
  <div class="card">
    <div class="step"><b class="num">2</b><h2>Upload WS report</h2></div>
    <div class="row">
      <div><label for="ws">Wholesaler</label><select id="ws"></select></div>
      <div style="flex:0 0 190px"><label for="vat">Price in the report</label>
        <select id="vat"><option value="exc">Ex. VAT</option><option value="inc">Inc. VAT</option></select></div>
      <div style="flex:0 0 auto"><label>&nbsp;</label><label class="btn file-btn">Choose WS file<input type="file" id="wsFile" accept=".xlsx,.xls,.xlsm,.csv"></label></div>
    </div>
    <div class="bar" style="margin-top:12px" hidden id="wsBar"><i></i></div>
    <p class="result" id="wsResult" hidden></p>

    <div id="fixBox" hidden>
      <p class="muted" style="margin:8px 0 10px" id="fixHint"></p>
      <div class="tbl-wrap"><table id="fixTbl"></table></div>
      <div class="line" style="margin-top:12px">
        <button class="btn" id="fixSave" type="button">Save</button>
        <button class="link" id="showAll" type="button">See all matches</button>
      </div>
    </div>

    <details id="colDetails" hidden>
      <summary>The columns look wrong? Fix how this WS file is read</summary>
      <div style="margin-top:12px">
        <div class="row">
          <div><label for="sheet">Sheet</label><select id="sheet"></select></div>
          <div><label for="layout">Layout</label>
            <select id="layout">
              <option value="table">Table — one sale per row</option>
              <option value="grouped">Grouped — customer row, then its products</option>
              <option value="boozia">BOOZIA — Sales History by Customer</option>
            </select></div>
          <div><label for="headerRow">Header row</label><input type="number" id="headerRow" min="1"></div>
          <div><label for="month">Month</label><input type="month" id="month"></div>
        </div>
        <div id="colBox" style="margin-top:12px"></div>
        <div class="tbl-wrap peek" style="margin-top:12px;max-height:280px"><table id="peek"></table></div>
        <p class="muted" id="readCheck" style="margin:10px 0"></p>
        <button class="btn" id="readAgain" type="button">Save this report again with these columns</button>
      </div>
    </details>
  </div>

  <!-- 3. Off-take -->
  <div class="card">
    <div class="step"><b class="num">3</b><h2>Off-take</h2></div>
    <div class="row">
      <div><label for="outMonth">Month</label><select id="outMonth"></select></div>
      <div><label for="outBde">Sales (BDE)</label><select id="outBde"></select></div>
      <div style="flex:0 0 auto"><label>&nbsp;</label><button class="btn" id="download" type="button">Download Off-take</button></div>
    </div>
    <p class="muted" id="outInfo" style="margin:12px 0 0"></p>
  </div>

  <div class="card">
    <h2>Reports uploaded</h2>
    <div class="tbl-wrap" style="max-height:340px"><table id="batches"></table></div>
  </div>
</main>
<datalist id="dlOutlets"></datalist>
<datalist id="dlSkus"></datalist>

<script>
let WS = [], book = null, aoa = [], lines = [], fileName = '', batch = null;
let groups = { customer: [], product: [] }, showAll = false, outLines = [];
const SKU = {}; (window.FORM_SKUS || []).forEach(s => SKU[s.code] = s);

(async () => {
  if (!await requireLogin()) return;
  document.getElementById('signout').onclick = async () => { await sb.auth.signOut(); location.replace('index.html'); };
  await Promise.all([loadWs(), loadMatchLists(), duInfo()]);
  fillDatalists();
  loadBatches();
  loadMonths();
})();

function fillDatalists() {
  document.getElementById('dlOutlets').innerHTML = M.outlets.map(o => `<option value="${esc(o._label)}">`).join('');
  document.getElementById('dlSkus').innerHTML = M.skus.map(s => `<option value="${esc(s._label)}">`).join('');
}

/* ── 1. Data U ── */
async function duInfo() {
  const { count } = await sb.from('outlets').select('code', { count: 'exact', head: true });
  const { data } = await sb.from('outlets').select('updated_at').order('updated_at', { ascending: false }).limit(1);
  document.getElementById('duInfo').innerHTML = count
    ? `<b>${fmt0(count)}</b> outlets · updated ${new Date(data[0].updated_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`
    : '<span class="err">No Data U yet — upload "New Data Universe_&lt;date&gt;.xlsm" first.</span>';
}
document.getElementById('duFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const msg = document.getElementById('duMsg'); msg.hidden = false;
  try {
    msg.textContent = 'Reading ' + f.name + ' (up to a minute)…';
    await new Promise(r => setTimeout(r, 50));
    const outlets = readDataU(await f.arrayBuffer());
    if (!outlets.length) throw new Error('no outlets found (sheets "Outlet" / "Filter")');
    const now = new Date().toISOString(); outlets.forEach(o => o.updated_at = now);
    await writeChunks('outlets', outlets, { onConflict: 'code' }, (n, t) => msg.textContent = `Saving ${fmt0(n)} / ${fmt0(t)} outlets…`);
    msg.textContent = `Done — ${fmt0(outlets.length)} outlets from ${f.name}.`;
    await Promise.all([duInfo(), loadMatchLists()]); fillDatalists();
  } catch (err) { msg.textContent = 'Stopped: ' + err.message; }
};

/* ── 2. WS report ── */
async function loadWs() {
  const { data, error } = await sb.from('wholesalers').select('*').eq('active', true).order('name');
  if (error) return toast(error.message, 'err');
  WS = data;
  let keep = ''; try { keep = localStorage.getItem('sn_ws') || ''; } catch (e) {}
  const s = document.getElementById('ws');
  s.innerHTML = '<option value="">Choose…</option>' + WS.map(w => `<option>${esc(w.name)}</option>`).join('');
  if (WS.some(w => w.name === keep)) s.value = keep;
  showVat();
}
const curWs = () => WS.find(w => w.name === document.getElementById('ws').value);
function showVat() { const w = curWs(); document.getElementById('vat').value = w ? w.price_vat : 'exc'; }
document.getElementById('ws').onchange = () => { try { localStorage.setItem('sn_ws', document.getElementById('ws').value); } catch (e) {} showVat(); };
document.getElementById('vat').onchange = async () => {
  const w = curWs(); if (!w) return;
  w.price_vat = document.getElementById('vat').value;
  const { error } = await sb.from('wholesalers').update({ price_vat: w.price_vat }).eq('name', w.name);
  toast(error ? error.message : `${w.name}: price ${w.price_vat === 'inc' ? 'Inc.' : 'Ex.'} VAT — saved`, error ? 'err' : 'ok');
};

/* the wholesaler from the file name (BOOSIA -> Boozia, CN -> CN Liqueur ...) */
function wsFromFileName(name) {
  const n = normKey(name).replace(/[^a-z0-9ก-๙]+/g, ' ');
  const alias = { boosia: 'Boozia', booza: 'Boozia', cn: 'CN Liqueur', sompop: 'Sompop', somphop: 'Sompop', patong: 'Patong Whiskey', cd: 'C.D. Supply', chiangmai: 'C.D. Supply', unique: 'Unique Asset' };
  for (const w of WS) if (n.includes(normKey(w.name).replace(/[^a-z0-9]+/g, ' '))) return w.name;
  for (const [k, v] of Object.entries(alias)) if (new RegExp('\\b' + k + '\\b').test(n) && WS.some(w => w.name === v)) return v;
  return '';
}

document.getElementById('wsFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  fileName = f.name;
  try { book = XLSX.read(await f.arrayBuffer(), { type: 'array' }); } catch (err) { return toast('Could not open the file: ' + err.message, 'err'); }
  if (!curWs()) { const g = wsFromFileName(f.name); if (g) { document.getElementById('ws').value = g; showVat(); } }
  if (!curWs()) { book = null; return toast('Choose the wholesaler of this file first', 'err'); }
  const hidden = n => ((book.Workbook && book.Workbook.Sheets) || []).some(s => s.name === n && s.Hidden);
  const list = book.SheetNames.filter(n => !hidden(n)).length ? book.SheetNames.filter(n => !hidden(n)) : book.SheetNames;
  const size = n => { const r = book.Sheets[n]['!ref']; return r ? XLSX.utils.decode_range(r).e.r : 0; };
  document.getElementById('sheet').innerHTML = list.map(n => `<option>${esc(n)}</option>`).join('');
  const w = curWs(), saved = w.config && w.config.layout ? w.config : null;
  document.getElementById('sheet').value = saved && list.includes(saved.sheet) ? saved.sheet : list.reduce((a, b) => size(b) > size(a) ? b : a);
  loadSheet();
  const fmt = saved ? { layout: saved.layout, config: saved } : guessLayout(aoa);
  setForm(fmt.layout, fmt.config);
  readLines(true);
  document.getElementById('colDetails').hidden = false;
  if (!lines.length) { document.getElementById('colDetails').open = true; return showResult(`<span class="err">No sales found in ${esc(f.name)} — fix the columns below.</span>`); }
  await saveReport();
};

function loadSheet() { aoa = XLSX.utils.sheet_to_json(book.Sheets[document.getElementById('sheet').value], { header: 1, raw: true, defval: '', blankrows: true }); }
function setForm(layout, config) {
  document.getElementById('layout').value = layout;
  document.getElementById('headerRow').value = config.headerRow || findHeaderRow(aoa);
  drawColBox(layout, config);
}
function letterOptions(sel) {
  const hr = +document.getElementById('headerRow').value || 1, head = aoa[hr - 1] || [];
  const width = Math.max(head.length, ...aoa.slice(0, 30).map(r => (r || []).length));
  let h = '<option value="">—</option>';
  for (let i = 0; i < width; i++) { const L = colLetter(i); h += `<option value="${L}"${L === sel ? ' selected' : ''}>${L}${head[i] !== '' && head[i] != null ? ' · ' + esc(String(head[i]).slice(0, 24)) : ''}</option>`; }
  return h;
}
function drawColBox(layout, config) {
  const box = document.getElementById('colBox');
  if (layout === 'boozia') { box.innerHTML = '<p class="muted">Columns are found by their names.</p>'; return; }
  const fields = layout === 'grouped'
    ? [['customerCol', 'Customer name (own row)'], ['productCol', 'Product name'], ['qtyCol', 'Quantity'], ['priceCol', 'Unit price'], ['amountCol', 'Amount']]
    : FIELDS.map(([k, l]) => [k, l + (NEED.includes(k) ? ' *' : '')]);
  const val = k => layout === 'grouped' ? config[k] : (config.cols || {})[k];
  box.innerHTML = '<div class="colmap">' + fields.map(([k, l]) => `<div><label>${l}</label><select data-k="${k}">${letterOptions(val(k))}</select></div>`).join('') + '</div>';
  box.querySelectorAll('select').forEach(s => s.onchange = () => readLines(false));
}
function readForm() {
  const layout = document.getElementById('layout').value;
  const config = { layout, sheet: document.getElementById('sheet').value, headerRow: +document.getElementById('headerRow').value || 1 };
  const sel = [...document.querySelectorAll('#colBox select')];
  if (layout === 'grouped') sel.forEach(s => config[s.dataset.k] = s.value);
  if (layout === 'table') { config.cols = {}; sel.forEach(s => { if (s.value) config.cols[s.dataset.k] = s.value; }); }
  return config;
}
document.getElementById('sheet').onchange = () => { loadSheet(); const g = guessLayout(aoa); setForm(g.layout, g.config); readLines(false); };
document.getElementById('layout').onchange = () => {
  const g = guessLayout(aoa), layout = document.getElementById('layout').value;
  setForm(layout, g.layout === layout ? g.config : (layout === 'grouped'
    ? { headerRow: g.config.headerRow, customerCol: 'A', productCol: 'A', qtyCol: 'B', amountCol: 'D' }
    : { headerRow: g.config.headerRow, cols: guessColumns(aoa, g.config.headerRow) }));
  readLines(false);
};
document.getElementById('headerRow').onchange = () => { const c = readForm(); if (c.layout === 'table') c.cols = guessColumns(aoa, c.headerRow); drawColBox(c.layout, c); readLines(false); };
document.getElementById('readAgain').onclick = () => { if (lines.length) saveReport(); };

function readLines(guessMonthToo) {
  const hr = +document.getElementById('headerRow').value || 1;
  const rows = aoa.slice(0, Math.max(hr + 6, 12)), width = Math.min(Math.max(...rows.map(r => (r || []).length), 1), 26);
  document.getElementById('peek').innerHTML = '<tr><th>#</th>' + Array.from({ length: width }, (_, i) => `<th>${colLetter(i)}</th>`).join('') + '</tr>' +
    rows.map((r, i) => `<tr${i + 1 === hr ? ' class="head"' : ''}><td class="muted">${i + 1}</td>` + Array.from({ length: width }, (_, j) => `<td>${esc(r && r[j])}</td>`).join('') + '</tr>').join('');
  const cfg = readForm();
  try { lines = parseSheet(aoa, cfg.layout, cfg); } catch (err) { lines = []; }
  if (guessMonthToo) {
    const g = guessMonth(aoa, lines);
    const d = new Date(); d.setMonth(d.getMonth() - 1);
    document.getElementById('month').value = g || d.toISOString().slice(0, 7);
  }
  const qty = lines.reduce((a, l) => a + (l.qty || 0), 0);
  document.getElementById('readCheck').textContent = `${fmt0(lines.length)} lines · ${fmt0(qty)} bottles read with these columns.`;
}

function showResult(html) { const r = document.getElementById('wsResult'); r.hidden = false; r.innerHTML = html; }

/* save the report, match it, keep the good matches, show what was not found */
async function saveReport() {
  const w = curWs(), month = document.getElementById('month').value, bar = document.getElementById('wsBar');
  bar.hidden = false; bar.firstChild.style.width = '5%';
  try {
    const cfg = readForm();
    await sb.from('wholesalers').update({ layout: cfg.layout, config: cfg, updated_at: new Date().toISOString() }).eq('name', w.name);
    w.layout = cfg.layout; w.config = cfg;
    await sb.from('import_batches').delete().eq('wholesaler', w.name).eq('month', month + '-01');
    const { data: b, error } = await sb.from('import_batches').insert({
      wholesaler: w.name, month: month + '-01', file_name: fileName, line_count: lines.length,
      qty: lines.reduce((a, l) => a + (l.qty || 0), 0), amount: lines.reduce((a, l) => a + (l.amount || 0), 0)
    }).select('*').single();
    if (error) throw error;
    await writeChunks('ws_lines', lines.map(l => ({ batch_id: b.id, ...l })), null, (n, t) => bar.firstChild.style.width = (5 + 70 * n / t) + '%');
    await matchBatch(b, true);
    bar.firstChild.style.width = '100%';
    loadBatches(); loadMonths(month + '-01');
  } catch (err) { toast('Not saved: ' + err.message, 'err'); }
  setTimeout(() => bar.hidden = true, 600);
}

/* autoSave: good name matches are kept straight away */
async function matchBatch(b, autoSave) {
  batch = b; showAll = false;
  const [ls, cm, pm, oc, op] = await Promise.all([
    fetchAll(() => sb.from('ws_lines').select('customer_key, customer_raw, customer_code, outlet_raw, product_key, product_raw, product_code, qty, amount').eq('batch_id', b.id).order('id')),
    fetchAll(() => sb.from('customer_map').select('*').eq('wholesaler', b.wholesaler)),
    fetchAll(() => sb.from('product_map').select('*').eq('wholesaler', b.wholesaler)),
    fetchAll(() => sb.from('customer_map').select('customer_key, outlet_code').neq('wholesaler', b.wholesaler).not('outlet_code', 'is', null)),
    fetchAll(() => sb.from('product_map').select('product_key, sku_code').neq('wholesaler', b.wholesaler).not('sku_code', 'is', null))
  ]);
  const savedC = {}, savedP = {}, otherC = {}, otherP = {};
  cm.forEach(m => savedC[m.customer_key] = m); pm.forEach(m => savedP[m.product_key] = m);
  oc.forEach(m => otherC[m.customer_key] = m.outlet_code); op.forEach(m => otherP[m.product_key] = m.sku_code);
  M.wsRegion = (WS.find(w => w.name === b.wholesaler) || {}).region || '';
  groups.customer = buildGroups(ls, 'customer_key', l => ({ kind: 'customer', name: l.customer_raw, outlet: l.outlet_raw, sub: [l.customer_code, l.outlet_raw].filter(Boolean).join(' · ') }));
  groups.product = buildGroups(ls, 'product_key', l => ({ kind: 'product', name: l.product_raw, sub: l.product_code || '' }));
  groups.customer.forEach(g => resolve('customer', g, savedC, otherC));
  groups.product.forEach(g => resolve('product', g, savedP, otherP));
  if (autoSave) await saveMaps(g => g.status === 'auto');
  drawFix();
}

function counts() {
  const c = groups.customer, p = groups.product, ok = g => g.value || g.skip;
  const btl = a => a.reduce((s, g) => s + g.qty, 0);
  return { c, p, cOk: c.filter(ok).length, pOk: p.filter(ok).length, cMiss: c.filter(g => !ok(g)), pMiss: p.filter(g => !ok(g)),
           btlIn: btl(c.filter(g => g.value && !g.skip)), btlAll: btl(c) };
}

function drawFix() {
  const k = counts();
  showResult(`<b>${esc(batch.wholesaler)} · ${monthLabel(batch.month)}</b> — ${fmt0(batch.line_count)} lines, ${fmt0(k.btlAll)} bottles. ` +
    `Outlets found <b>${fmt0(k.cOk)} / ${fmt0(k.c.length)}</b>, products found <b>${fmt0(k.pOk)} / ${fmt0(k.p.length)}</b>.` +
    (k.cMiss.length || k.pMiss.length ? ` <span class="warn">${fmt0(k.cMiss.length + k.pMiss.length)} not found — pick them below or skip.</span>` : ' <span class="ok">All found.</span>'));
  const rows = showAll ? [...groups.customer, ...groups.product] : [...k.cMiss, ...k.pMiss];
  document.getElementById('fixBox').hidden = !rows.length && !showAll;
  document.getElementById('showAll').textContent = showAll ? 'Show only not found' : 'See all matches';
  document.getElementById('fixHint').textContent = showAll
    ? 'Every customer and product of this report with its match. Change any that is wrong, then Save.'
    : 'Type the outlet / SKU code or name, or click a suggestion. "Skip" = not an outlet (cash, staff) or not our product.';
  const shown = rows.slice(0, 400);
  document.getElementById('fixTbl').innerHTML = '<tr><th>From the WS report</th><th class="n">Bottles</th><th>Match to</th><th></th></tr>' +
    shown.map((g, i) => {
      const byCode = g.kind === 'customer' ? M.OUT : M.SKU;
      const label = g.value ? (byCode[g.value] ? byCode[g.value]._label : g.value) : '';
      const sug = !g.value && !g.skip && g.cands ? g.cands.slice(0, 3).map(c => `<button class="sug" type="button" data-i="${i}" data-c="${esc(c.x.code)}">${esc(c.x._label)}</button>`).join('') : '';
      return `<tr class="${g.skip ? 'skip' : ''}"><td><span class="pill">${g.kind === 'customer' ? 'Outlet' : 'Product'}</span> ${esc(g.name)}${g.sub ? '<br><span class="muted">' + esc(g.sub) + '</span>' : ''}</td>
        <td class="n">${fmt0(g.qty)}</td>
        <td class="pick"><input type="text" list="${g.kind === 'customer' ? 'dlOutlets' : 'dlSkus'}" data-i="${i}" value="${esc(label)}" placeholder="${g.kind === 'customer' ? 'Data U outlet' : 'Form SKU'}"${g.skip ? ' disabled' : ''}><div>${sug}</div></td>
        <td><button class="btn small gray" type="button" data-skip="${i}">${g.skip ? 'Undo skip' : 'Skip'}</button></td></tr>`;
    }).join('');
  const tbl = document.getElementById('fixTbl');
  tbl.querySelectorAll('input[type=text]').forEach(inp => inp.onchange = () => {
    const g = shown[+inp.dataset.i], byCode = g.kind === 'customer' ? M.OUT : M.SKU, v = inp.value.trim(), code = v.split(' — ')[0].trim();
    if (v && !byCode[code]) return toast('Not in the list: ' + v, 'err');
    g.value = v ? code : null; g.dirty = true;
  });
  tbl.querySelectorAll('.sug').forEach(b => b.onclick = () => { const g = shown[+b.dataset.i]; g.value = b.dataset.c; g.skip = false; g.dirty = true; drawFix(); });
  tbl.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => { const g = shown[+b.dataset.skip]; g.skip = !g.skip; g.dirty = true; drawFix(); });
}
document.getElementById('showAll').onclick = () => { showAll = !showAll; drawFix(); };
document.getElementById('fixSave').onclick = async () => {
  try { const n = await saveMaps(g => g.dirty); toast(n ? `Saved ${n}` : 'Nothing changed', 'ok'); drawFix(); loadMonths(batch.month); }
  catch (err) { toast('Not saved: ' + err.message, 'err'); }
};

async function saveMaps(which) {
  const ws = batch.wholesaler, now = new Date().toISOString();
  const cRows = groups.customer.filter(g => which(g) && (g.value || g.skip)).map(g => ({ wholesaler: ws, customer_key: g.key, raw_name: g.name + (g.outlet ? ' | ' + g.outlet : ''), outlet_code: g.skip ? null : g.value, skip: !!g.skip, updated_at: now }));
  const pRows = groups.product.filter(g => which(g) && (g.value || g.skip)).map(g => ({ wholesaler: ws, product_key: g.key, raw_name: g.name, sku_code: g.skip ? null : g.value, skip: !!g.skip, factor: g.factor || 1, updated_at: now }));
  if (cRows.length) await writeChunks('customer_map', cRows, { onConflict: 'wholesaler,customer_key' });
  if (pRows.length) await writeChunks('product_map', pRows, { onConflict: 'wholesaler,product_key' });
  [...groups.customer, ...groups.product].forEach(g => { if (which(g) && (g.value || g.skip)) { g.status = 'saved'; g.dirty = false; } });
  return cRows.length + pRows.length;
}

/* ── 3. Off-take ── */
async function loadMonths(pick) {
  const { data } = await sb.from('import_batches').select('month');
  const months = [...new Set((data || []).map(b => b.month))].sort().reverse();
  const s = document.getElementById('outMonth'), keep = pick || s.value;
  s.innerHTML = months.length ? months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('') : '<option value="">No report yet</option>';
  if (months.includes(keep)) s.value = keep;
  loadOutLines();
}
async function loadOutLines() {
  const m = document.getElementById('outMonth').value;
  outLines = m ? await fetchAll(() => sb.from('form_lines').select('outlet_code, month, wholesaler, price_vat, sku_code, btls, price_per_btl').eq('month', m)) : [];
  const bdes = [...new Set(outLines.map(l => bdeOf(l.outlet_code)).filter(Boolean))].sort();
  const s = document.getElementById('outBde'), keep = s.value;
  s.innerHTML = '<option value="">All sales</option>' + bdes.map(b => `<option>${esc(b)}</option>`).join('');
  if (bdes.includes(keep)) s.value = keep;
  outInfo();
}
const bdeOf = code => { const o = M.OUT[code]; return o ? (o.current_bde || o.bde || '') : ''; };
function selectedOutlets() {
  const bde = document.getElementById('outBde').value, by = {};
  outLines.forEach(l => { if (!bde || bdeOf(l.outlet_code) === bde) (by[l.outlet_code] = by[l.outlet_code] || []).push(l); });
  return by;
}
function outInfo() {
  const by = selectedOutlets(), codes = Object.keys(by);
  const btls = codes.reduce((a, c) => a + by[c].reduce((s, l) => s + +l.btls, 0), 0);
  document.getElementById('outInfo').textContent = codes.length
    ? `${fmt0(codes.length)} outlets · ${fmt0(btls)} bottles — one sheet per outlet, laid out like sheet 01 of the Off-Take & Outlet Rebate Calculation form.`
    : 'Nothing for this month yet.';
  document.getElementById('download').disabled = !codes.length;
}
document.getElementById('outMonth').onchange = loadOutLines;
document.getElementById('outBde').onchange = outInfo;

document.getElementById('download').onclick = async () => {
  const btn = document.getElementById('download'), m = document.getElementById('outMonth').value, bde = document.getElementById('outBde').value;
  if (location.protocol === 'file:') return toast('Download works on the website (vercel.app), not from the file on this computer', 'err');
  btn.disabled = true; btn.textContent = 'Preparing…';
  try {
    const by = selectedOutlets(), [y, mm] = m.split('-').map(Number);
    const sheets = Object.entries(by).map(([code, ls]) => ({ outlet: M.OUT[code] || { code }, month: mm, year: y, rows: formRows(ls, SKU) }))
      .sort((a, b) => String(a.outlet.outlet_name || a.outlet.code).localeCompare(String(b.outlet.outlet_name || b.outlet.code)));
    const blob = await buildOfftakeWorkbook(sheets, M.skus);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Off-Take ${monthLabel(m)}${bde ? ' - ' + bde.replace(/[\\/:*?"<>|]/g, ' ') : ''}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    const below = sheets.reduce((n, s) => n + s.rows.filter(r => SKU[r.code] && !SKU[r.code].calc).length, 0);
    toast(below ? `Downloaded. ${below} SKU line(s) sit below row 394, where the form does not add them up.` : 'Downloaded', below ? '' : 'ok');
  } catch (err) { toast('Could not make the file: ' + err.message, 'err'); }
  btn.disabled = false; btn.textContent = 'Download Off-take';
};

/* ── reports list ── */
async function loadBatches() {
  const { data, error } = await sb.from('import_batches').select('*').order('month', { ascending: false }).order('wholesaler').limit(60);
  if (error) return;
  document.getElementById('batches').innerHTML = '<tr><th>Month</th><th>Wholesaler</th><th>File</th><th class="n">Bottles</th><th></th></tr>' +
    (data.length ? data.map(b => `<tr><td>${monthLabel(b.month)}</td><td>${esc(b.wholesaler)}</td><td class="muted">${esc(b.file_name || '')}</td><td class="n">${fmt0(b.qty)}</td>
      <td style="white-space:nowrap"><button class="btn small light" data-open="${b.id}">Check</button> <button class="btn small gray" data-del="${b.id}">Delete</button></td></tr>`).join('')
      : '<tr><td colspan="5" class="muted">Nothing uploaded yet.</td></tr>');
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = async () => {
    const { data: bb } = await sb.from('import_batches').select('*').eq('id', +b.dataset.open).single();
    await matchBatch(bb, false); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this report? Its bottles are taken out of the Off-take.')) return;
    const { error } = await sb.from('import_batches').delete().eq('id', +b.dataset.del);
    if (error) return toast(error.message, 'err');
    toast('Deleted', 'ok'); loadBatches(); loadMonths();
  });
}
</script>
