<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import WS Report</title>
<link rel="icon" href="img/supernovas-64.png">
<link rel="apple-touch-icon" href="img/supernovas-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/config.js?v=1"></script>
<script src="js/common.js?v=3"></script>
<script src="js/parsers.js?v=2"></script>
<script src="js/match.js?v=1"></script>
<style>
  .peek td { font-size: 12px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .peek tr.head td { background: var(--c3); font-weight: 600; }
  .colmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .step { display: flex; gap: 12px; align-items: baseline; margin-bottom: 14px; }
  .step b.num { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: var(--c1); color: #fff; display: grid; place-items: center; font-size: 14px; }
  .step h2 { margin: 0; }
  td.pick { min-width: 340px; }
  .sug { display: inline-block; margin: 4px 6px 0 0; padding: 2px 10px; border-radius: 99px; background: #F3F4F6; font-size: 12px; cursor: pointer; border: 0; color: var(--text); }
  .sug:hover { background: var(--c3); color: var(--c1); }
  tr.skip td { color: #9CA3AF; }
  input.bad { outline: 2px solid #FCA5A5; }
  .factor { width: 70px; }
  .summary { font-size: 15px; margin: 4px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Import WS report</h1>
  <p class="sub">Upload a wholesaler's monthly report, check which Data U outlet each customer is, save. The Off-take forms are then filled in for you.</p>

  <div class="card">
    <div class="step"><b class="num">1</b><h2>Upload the report</h2></div>
    <div class="row">
      <div><label for="ws">Wholesaler</label><select id="ws"></select></div>
      <div><label for="month">Month of the report</label><input type="month" id="month"></div>
    </div>
    <label class="drop" id="drop" style="margin-top:16px">
      <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv">
      <b>Choose the WS file</b> or drop it here
    </label>
    <div id="readBox" hidden>
      <p class="summary" id="readSummary"></p>
      <p id="readNote" class="muted" style="margin:4px 0 0"></p>
      <div class="row" style="margin-top:14px">
        <div style="flex:0 0 auto"><button class="btn" id="save" type="button">Next: check outlets</button></div>
        <div style="flex:0 0 auto"><button class="link" id="toggleCols" type="button">Columns look wrong?</button></div>
      </div>
      <div class="bar" style="margin-top:10px" hidden id="saveBar"><i></i></div>
      <div id="colPanel" hidden style="margin-top:16px">
        <div class="row">
          <div><label for="sheet">Sheet</label><select id="sheet"></select></div>
          <div><label for="layout">Layout</label>
            <select id="layout">
              <option value="table">Table — one sale per row</option>
              <option value="grouped">Grouped — customer row, then its products</option>
              <option value="boozia">BOOZIA — Sales History by Customer</option>
            </select></div>
          <div><label for="headerRow">Header row</label><input type="number" id="headerRow" min="1"></div>
        </div>
        <div id="colBox" style="margin-top:14px"></div>
        <div class="tbl-wrap peek" style="margin-top:14px;max-height:300px"><table id="peek"></table></div>
        <div class="tbl-wrap" style="margin-top:14px;max-height:300px"><table id="resTbl"></table></div>
      </div>
    </div>
  </div>

  <div class="card" id="checkCard" hidden>
    <div class="step"><b class="num">2</b><h2 id="checkTitle">Check outlets</h2></div>
    <div class="grid kpis" id="kpis"></div>
    <div class="tabs">
      <button type="button" data-tab="customer" class="on">Outlets</button>
      <button type="button" data-tab="product">Products</button>
    </div>
    <div class="row" style="margin-bottom:12px">
      <div><input type="search" id="q" placeholder="Search"></div>
      <div style="flex:0 0 auto"><select id="show"><option value="check">To check</option><option value="all">All</option></select></div>
      <div style="flex:0 0 auto"><button class="btn" id="saveMaps" type="button">Save</button></div>
    </div>
    <p class="muted" id="hint" style="margin:-4px 0 10px"></p>
    <div class="tbl-wrap"><table id="tbl"></table></div>
  </div>

  <div class="card">
    <h2>Uploaded reports</h2>
    <div class="tbl-wrap"><table id="batches"></table></div>
  </div>
</main>
<datalist id="dlOutlets"></datalist>
<datalist id="dlSkus"></datalist>

<script>
let WS = [], book = null, aoa = [], lines = [], fileName = '', monthPicked = false;
let batch = null, groups = { customer: [], product: [] }, tab = 'customer';
const STATUS = { saved: '<span class="pill ok">Remembered</span>', auto: '<span class="pill warn">Auto — check</span>', none: '<span class="pill err">Not found</span>', edited: '<span class="pill">Changed</span>' };

(async () => {
  if (!await requireLogin()) return;
  renderNav();
  const d = new Date(); d.setMonth(d.getMonth() - 1);
  document.getElementById('month').value = d.toISOString().slice(0, 7);
  await Promise.all([loadWs(), loadMatchLists()]);
  document.getElementById('dlOutlets').innerHTML = M.outlets.map(o => `<option value="${esc(o._label)}">`).join('');
  document.getElementById('dlSkus').innerHTML = M.skus.map(s => `<option value="${esc(s._label)}">`).join('');
  if (!M.outlets.length) toast('No Data U outlets yet — upload the Data U file on Settings first', 'err');
  loadBatches();
  const id = new URLSearchParams(location.search).get('batch');
  if (id) openBatch(+id);
})();

async function loadWs() {
  const { data, error } = await sb.from('wholesalers').select('*').eq('active', true).order('name');
  if (error) return toast(error.message, 'err');
  WS = data;
  const s = document.getElementById('ws');
  let keep = ''; try { keep = localStorage.getItem('sn_ws') || ''; } catch (e) {}
  s.innerHTML = '<option value="">Choose…</option>' + WS.map(w => `<option>${esc(w.name)}</option>`).join('');
  if (WS.some(w => w.name === keep)) s.value = keep;
}
const curWs = () => WS.find(w => w.name === document.getElementById('ws').value);
document.getElementById('ws').onchange = () => {
  try { localStorage.setItem('sn_ws', document.getElementById('ws').value); } catch (e) {}
  if (book) useSavedFormat();
};
document.getElementById('month').addEventListener('change', () => { monthPicked = true; if (book) run(); });
document.getElementById('toggleCols').onclick = () => { const p = document.getElementById('colPanel'); p.hidden = !p.hidden; };

/* ── step 1: read the file ── */
const drop = document.getElementById('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); };
document.getElementById('file').onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); e.target.value = ''; };

async function readFile(f) {
  if (!curWs()) return toast('Choose the wholesaler first', 'err');
  fileName = f.name; monthPicked = false;
  try { book = XLSX.read(await f.arrayBuffer(), { type: 'array' }); }
  catch (e) { return toast('Could not open the file: ' + e.message, 'err'); }
  const hidden = n => ((book.Workbook && book.Workbook.Sheets) || []).some(s => s.name === n && s.Hidden);
  const list = book.SheetNames.filter(n => !hidden(n)).length ? book.SheetNames.filter(n => !hidden(n)) : book.SheetNames;
  const size = n => { const r = book.Sheets[n]['!ref']; return r ? XLSX.utils.decode_range(r).e.r : 0; };
  document.getElementById('sheet').innerHTML = list.map(n => `<option>${esc(n)}</option>`).join('');
  document.getElementById('sheet').value = list.reduce((a, b) => size(b) > size(a) ? b : a);
  document.getElementById('readBox').hidden = false;
  useSavedFormat();
}
function loadSheet() {
  aoa = XLSX.utils.sheet_to_json(book.Sheets[document.getElementById('sheet').value], { header: 1, raw: true, defval: '', blankrows: true });
}
function useSavedFormat() {
  const w = curWs(), saved = w && w.config && w.config.layout ? w.config : null;
  if (saved && saved.sheet && book.SheetNames.includes(saved.sheet)) document.getElementById('sheet').value = saved.sheet;
  loadSheet();
  const f = saved ? { layout: saved.layout, config: saved } : guessLayout(aoa);
  setForm(f.layout, f.config);
  run();
}
function setForm(layout, config) {
  document.getElementById('layout').value = layout;
  document.getElementById('headerRow').value = config.headerRow || findHeaderRow(aoa);
  drawColBox(layout, config);
}
function letterOptions(sel) {
  const hr = +document.getElementById('headerRow').value || 1, head = aoa[hr - 1] || [];
  const width = Math.max(head.length, ...aoa.slice(0, 30).map(r => (r || []).length));
  let h = '<option value="">—</option>';
  for (let i = 0; i < width; i++) {
    const L = colLetter(i);
    h += `<option value="${L}"${L === sel ? ' selected' : ''}>${L}${head[i] !== '' && head[i] != null ? ' · ' + esc(String(head[i]).slice(0, 26)) : ''}</option>`;
  }
  return h;
}
function drawColBox(layout, config) {
  const box = document.getElementById('colBox');
  if (layout === 'boozia') { box.innerHTML = '<p class="muted">Columns are found by their names.</p>'; return; }
  const fields = layout === 'grouped'
    ? [['customerCol', 'Customer name (own row)'], ['productCol', 'Product name'], ['qtyCol', 'Quantity'], ['priceCol', 'Unit price'], ['amountCol', 'Amount']]
    : FIELDS.map(([k, l]) => [k, l + (NEED.includes(k) ? ' *' : '')]);
  const val = k => layout === 'grouped' ? config[k] : (config.cols || {})[k];
  box.innerHTML = '<div class="colmap">' + fields.map(([k, l]) => `<div><label>${l}</label><select data-k="${k}">${letterOptions(val(k))}</select></div>`).join('') + '</div>';
  box.querySelectorAll('select').forEach(s => s.onchange = run);
}
function readForm() {
  const layout = document.getElementById('layout').value;
  const config = { layout, sheet: document.getElementById('sheet').value, headerRow: +document.getElementById('headerRow').value || 1 };
  const sel = [...document.querySelectorAll('#colBox select')];
  if (layout === 'grouped') sel.forEach(s => config[s.dataset.k] = s.value);
  if (layout === 'table') { config.cols = {}; sel.forEach(s => { if (s.value) config.cols[s.dataset.k] = s.value; }); }
  return config;
}
document.getElementById('sheet').onchange = () => { loadSheet(); const g = guessLayout(aoa); setForm(g.layout, g.config); run(); };
document.getElementById('layout').onchange = () => {
  const g = guessLayout(aoa), layout = document.getElementById('layout').value;
  const cfg = g.layout === layout ? g.config : (layout === 'grouped'
    ? { headerRow: g.config.headerRow, customerCol: 'A', productCol: 'A', qtyCol: 'B', amountCol: 'D' }
    : { headerRow: g.config.headerRow, cols: guessColumns(aoa, g.config.headerRow) });
  setForm(layout, cfg); run();
};
document.getElementById('headerRow').onchange = () => {
  const cfg = readForm();
  if (cfg.layout === 'table') cfg.cols = guessColumns(aoa, cfg.headerRow);
  drawColBox(cfg.layout, cfg); run();
};

function run() {
  const hr = +document.getElementById('headerRow').value || 1;
  const rows = aoa.slice(0, Math.max(hr + 8, 14)), width = Math.min(Math.max(...rows.map(r => (r || []).length), 1), 26);
  document.getElementById('peek').innerHTML = '<tr><th>#</th>' + Array.from({ length: width }, (_, i) => `<th>${colLetter(i)}</th>`).join('') + '</tr>' +
    rows.map((r, i) => `<tr${i + 1 === hr ? ' class="head"' : ''}><td class="muted">${i + 1}</td>` + Array.from({ length: width }, (_, j) => `<td>${esc(r && r[j])}</td>`).join('') + '</tr>').join('');
  const cfg = readForm();
  try { lines = parseSheet(aoa, cfg.layout, cfg); } catch (e) { lines = []; toast(e.message, 'err'); }
  if (!monthPicked) { const g = guessMonth(aoa, lines); if (g) document.getElementById('month').value = g; }
  const qty = lines.reduce((a, l) => a + (l.qty || 0), 0);
  const cust = new Set(lines.map(l => l.customer_key)).size, prod = new Set(lines.map(l => l.product_key)).size;
  const m = document.getElementById('month').value;
  document.getElementById('readSummary').innerHTML = lines.length
    ? `<b>${esc(fileName)}</b> — ${fmt0(lines.length)} lines · ${fmt0(qty)} bottles · ${fmt0(cust)} customers · ${fmt0(prod)} products · month <b>${monthLabel(m + '-01')}</b>`
    : `<span class="err">No sales found in ${esc(fileName)} — press "Columns look wrong?" and pick the columns.</span>`;
  const other = lines.filter(l => l.doc_date && l.doc_date.slice(0, 7) !== m).length;
  document.getElementById('readNote').textContent = other ? `${fmt0(other)} lines are dated outside this month; all are saved under ${monthLabel(m + '-01')}.` : '';
  if (!lines.length) document.getElementById('colPanel').hidden = false;
  document.getElementById('resTbl').innerHTML = '<tr><th>Date</th><th>Customer</th><th>Outlet</th><th>Product</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr>' +
    lines.slice(0, 40).map(l => `<tr><td>${esc(l.doc_date || '')}</td><td>${esc(l.customer_raw)}</td><td>${esc(l.outlet_raw || '')}</td><td>${esc(l.product_raw)}</td><td class="n">${fmt0(l.qty)}</td><td class="n">${fmt2(l.unit_price)}</td><td class="n">${fmt2(l.amount)}</td></tr>`).join('');
  document.getElementById('save').disabled = !lines.length;
}

/* save the report (replaces the same WS + month) and go to step 2 */
document.getElementById('save').onclick = async () => {
  const w = curWs(), month = document.getElementById('month').value;
  if (!w || !month) return toast('Choose the wholesaler and the month', 'err');
  const btn = document.getElementById('save'), bar = document.getElementById('saveBar');
  btn.disabled = true; bar.hidden = false;
  try {
    const cfg = readForm();
    await sb.from('wholesalers').update({ layout: cfg.layout, config: cfg, updated_at: new Date().toISOString() }).eq('name', w.name);
    w.layout = cfg.layout; w.config = cfg;
    await sb.from('import_batches').delete().eq('wholesaler', w.name).eq('month', month + '-01');
    const { data: b, error } = await sb.from('import_batches').insert({
      wholesaler: w.name, month: month + '-01', file_name: fileName, line_count: lines.length,
      qty: lines.reduce((a, l) => a + (l.qty || 0), 0), amount: lines.reduce((a, l) => a + (l.amount || 0), 0)
    }).select('id').single();
    if (error) throw error;
    await writeChunks('ws_lines', lines.map(l => ({ batch_id: b.id, ...l })), null, (n, t) => { bar.firstChild.style.width = (100 * n / t) + '%'; });
    bar.hidden = true;
    history.replaceState(null, '', '?batch=' + b.id);
    await openBatch(b.id);
    loadBatches();
  } catch (e) { toast('Not saved: ' + e.message, 'err'); bar.hidden = true; }
  btn.disabled = false;
};

/* ── step 2: check outlets / products ── */
async function openBatch(id) {
  const { data: b, error } = await sb.from('import_batches').select('*').eq('id', id).single();
  if (error) return toast(error.message, 'err');
  batch = b;
  const [ls, cm, pm, oc, op] = await Promise.all([
    fetchAll(() => sb.from('ws_lines').select('customer_key, customer_raw, customer_code, outlet_raw, product_key, product_raw, product_code, qty, amount').eq('batch_id', id).order('id')),
    fetchAll(() => sb.from('customer_map').select('*').eq('wholesaler', b.wholesaler)),
    fetchAll(() => sb.from('product_map').select('*').eq('wholesaler', b.wholesaler)),
    fetchAll(() => sb.from('customer_map').select('customer_key, outlet_code').neq('wholesaler', b.wholesaler).not('outlet_code', 'is', null)),
    fetchAll(() => sb.from('product_map').select('product_key, sku_code').neq('wholesaler', b.wholesaler).not('sku_code', 'is', null))
  ]);
  const savedC = {}, savedP = {}, otherC = {}, otherP = {};
  cm.forEach(m => savedC[m.customer_key] = m); pm.forEach(m => savedP[m.product_key] = m);
  oc.forEach(m => otherC[m.customer_key] = m.outlet_code); op.forEach(m => otherP[m.product_key] = m.sku_code);
  groups.customer = buildGroups(ls, 'customer_key', l => ({ name: l.customer_raw, outlet: l.outlet_raw, sub: [l.customer_code, l.outlet_raw].filter(Boolean).join(' · ') }));
  groups.product = buildGroups(ls, 'product_key', l => ({ name: l.product_raw, sub: l.product_code || '' }));
  M.wsRegion = (WS.find(w => w.name === b.wholesaler) || {}).region || '';
  groups.customer.forEach(g => resolve('customer', g, savedC, otherC));
  groups.product.forEach(g => resolve('product', g, savedP, otherP));
  document.getElementById('checkTitle').textContent = `Check outlets — ${b.wholesaler} · ${monthLabel(b.month)}`;
  document.getElementById('checkCard').hidden = false;
  draw();
  document.getElementById('checkCard').scrollIntoView({ behavior: 'smooth' });
}

function kpis() {
  const c = groups.customer, p = groups.product;
  const ok = g => g.skip || g.value;
  const auto = c.filter(g => g.status === 'auto').length + p.filter(g => g.status === 'auto').length;
  const none = c.filter(g => !ok(g)).length + p.filter(g => !ok(g)).length;
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><small>Outlets found</small><b>${fmt0(c.filter(ok).length)} / ${fmt0(c.length)}</b></div>` +
    `<div class="kpi"><small>Products found</small><b>${fmt0(p.filter(ok).length)} / ${fmt0(p.length)}</b></div>` +
    `<div class="kpi"><small>To check · not found</small><b>${fmt0(auto)} · ${fmt0(none)}</b></div>`;
  document.querySelector('[data-tab=customer]').textContent = `Outlets (${fmt0(c.filter(g => g.status !== 'saved').length)} to check)`;
  document.querySelector('[data-tab=product]').textContent = `Products (${fmt0(p.filter(g => g.status !== 'saved').length)} to check)`;
}

function draw() {
  kpis();
  const kind = tab, q = normKey(document.getElementById('q').value), show = document.getElementById('show').value;
  const order = { none: 0, auto: 1, edited: 2, saved: 3 };
  const rows = groups[kind].filter(g => (show === 'all' || g.status !== 'saved') && (!q || normKey(g.name + ' ' + g.sub).includes(q)))
    .sort((a, b) => order[a.status] - order[b.status] || b.qty - a.qty);
  document.getElementById('hint').textContent = kind === 'customer'
    ? 'Auto = picked by the closest Data U name; change it if wrong. Not found = type the outlet code or name. Tick "Not an outlet" for cash sales and staff.'
    : 'Pick the SKU of the form. "Bottles per unit" = 6 or 12 when the WS reports cases. Tick "Not ours" for products that are not in the form.';
  const shown = rows.slice(0, 300), byCode = kind === 'customer' ? M.OUT : M.SKU;
  document.getElementById('tbl').innerHTML =
    `<tr><th>WS ${kind === 'customer' ? 'customer' : 'product'}</th><th class="n">Bottles</th><th>${kind === 'customer' ? 'Data U outlet' : 'Form SKU'}</th><th></th>${kind === 'product' ? '<th>Bottles per unit</th>' : ''}<th>${kind === 'customer' ? 'Not an outlet' : 'Not ours'}</th></tr>` +
    (shown.length ? shown.map((g, i) => {
      const label = g.value ? (byCode[g.value] ? byCode[g.value]._label : g.value) : '';
      const sug = g.status !== 'saved' && g.cands ? g.cands.filter(c => c.x.code !== g.value).slice(0, 3)
        .map(c => `<button class="sug" type="button" data-i="${i}" data-c="${esc(c.x.code)}">${esc(c.x._label)}</button>`).join('') : '';
      return `<tr class="${g.skip ? 'skip' : ''}"><td>${esc(g.name)}${g.sub ? '<br><span class="muted">' + esc(g.sub) + '</span>' : ''}</td>
        <td class="n">${fmt0(g.qty)}</td>
        <td class="pick"><input type="text" list="${kind === 'customer' ? 'dlOutlets' : 'dlSkus'}" data-i="${i}" value="${esc(label)}" placeholder="Type code or name"${g.skip ? ' disabled' : ''}><div>${sug}</div></td>
        <td>${STATUS[g.status]}</td>
        ${kind === 'product' ? `<td><input type="number" class="factor" min="0" step="any" data-i="${i}" value="${g.factor}"></td>` : ''}
        <td><input type="checkbox" class="skipbox" data-i="${i}"${g.skip ? ' checked' : ''}></td></tr>`;
    }).join('') : `<tr><td colspan="6" class="muted">${show === 'check' ? 'Nothing to check — press Save.' : 'Nothing found.'}</td></tr>`) +
    (rows.length > shown.length ? `<tr><td colspan="6" class="muted">Showing 300 of ${fmt0(rows.length)}.</td></tr>` : '');
  const tbl = document.getElementById('tbl'), edit = g => { g.status = 'edited'; g.dirty = true; };
  tbl.querySelectorAll('input[type=text]').forEach(inp => inp.onchange = () => {
    const g = shown[+inp.dataset.i], v = inp.value.trim(), code = v.split(' — ')[0].trim();
    if (v && !byCode[code]) { inp.classList.add('bad'); return toast('Not in the list: ' + v, 'err'); }
    inp.classList.remove('bad'); g.value = v ? code : null; edit(g); kpis();
  });
  tbl.querySelectorAll('.sug').forEach(b => b.onclick = () => { const g = shown[+b.dataset.i]; g.value = b.dataset.c; g.skip = false; edit(g); draw(); });
  tbl.querySelectorAll('.factor').forEach(inp => inp.onchange = () => { const g = shown[+inp.dataset.i]; g.factor = +inp.value || 1; edit(g); });
  tbl.querySelectorAll('.skipbox').forEach(cb => cb.onchange = () => { const g = shown[+cb.dataset.i]; g.skip = cb.checked; edit(g); draw(); });
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  tab = b.dataset.tab; draw();
});
document.getElementById('q').oninput = draw;
document.getElementById('show').onchange = draw;

/* Save = keep every answer on screen (auto picks included) for next month */
document.getElementById('saveMaps').onclick = async () => {
  const btn = document.getElementById('saveMaps'); btn.disabled = true;
  try {
    const ws = batch.wholesaler, now = new Date().toISOString();
    const keep = g => g.status !== 'saved' || g.dirty;
    const cRows = groups.customer.filter(g => keep(g) && (g.value || g.skip)).map(g => ({ wholesaler: ws, customer_key: g.key, raw_name: g.name + (g.outlet ? ' | ' + g.outlet : ''), outlet_code: g.skip ? null : g.value, skip: !!g.skip, updated_at: now }));
    const pRows = groups.product.filter(g => keep(g) && (g.value || g.skip)).map(g => ({ wholesaler: ws, product_key: g.key, raw_name: g.name, sku_code: g.skip ? null : g.value, skip: !!g.skip, factor: g.factor || 1, updated_at: now }));
    if (cRows.length) await writeChunks('customer_map', cRows, { onConflict: 'wholesaler,customer_key' });
    if (pRows.length) await writeChunks('product_map', pRows, { onConflict: 'wholesaler,product_key' });
    [...groups.customer, ...groups.product].forEach(g => { if (g.value || g.skip) { g.status = 'saved'; g.dirty = false; } });
    const left = groups.customer.filter(g => !g.value && !g.skip).length + groups.product.filter(g => !g.value && !g.skip).length;
    toast(left ? `Saved. ${left} still not found — they are left out of the forms.` : 'Saved — the Off-take forms are ready', 'ok');
    draw();
  } catch (e) { toast('Not saved: ' + e.message, 'err'); }
  btn.disabled = false;
};

async function loadBatches() {
  const { data, error } = await sb.from('import_batches').select('*').order('month', { ascending: false }).order('wholesaler').limit(60);
  if (error) return;
  document.getElementById('batches').innerHTML = '<tr><th>Wholesaler</th><th>Month</th><th>File</th><th class="n">Lines</th><th class="n">Bottles</th><th>Uploaded</th><th></th></tr>' +
    (data.length ? data.map(b => `<tr><td>${esc(b.wholesaler)}</td><td>${monthLabel(b.month)}</td><td>${esc(b.file_name || '')}</td>
      <td class="n">${fmt0(b.line_count)}</td><td class="n">${fmt0(b.qty)}</td>
      <td class="muted">${new Date(b.created_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}</td>
      <td style="white-space:nowrap"><button class="btn small light" onclick="history.replaceState(null,'','?batch=${b.id}');openBatch(${b.id})">Check</button>
      <button class="btn small gray" onclick="delBatch(${b.id})">Delete</button></td></tr>`).join('')
      : '<tr><td colspan="7" class="muted">Nothing uploaded yet.</td></tr>');
}
async function delBatch(id) {
  if (!confirm('Delete this report? Its bottles are taken out of the Off-take forms.')) return;
  const { error } = await sb.from('import_batches').delete().eq('id', id);
  if (error) return toast(error.message, 'err');
  if (batch && batch.id === id) document.getElementById('checkCard').hidden = true;
  toast('Deleted', 'ok'); loadBatches();
}
</script>
